<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b63f6">
  <meta name="robots" content="noindex">
  <title>E-Wallet Replica · ISCS 30.17 Prototype</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- The phone. On desktop it renders as a device frame; on a real phone it fills the screen.
       The overlay should mount INSIDE #device (position:absolute; inset:0; z-index >= 100). -->
  <div id="device">
    <div class="statusbar" aria-hidden="true">
      <span id="sb-time">9:41</span>
      <span class="sb-icons"><i class="sig"></i><i class="sig"></i><i class="sig"></i><i class="sig"></i><span class="batt"></span></span>
    </div>

    <main id="screen"></main>

    <nav id="bottom-nav" class="bottom-nav" hidden>
      <button data-action="nav" data-to="home" data-tab="home" data-guide="tab.home"><svg class="i" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg><span>Home</span></button>
      <button data-action="nav" data-to="inbox" data-tab="inbox" data-guide="tab.inbox"><svg class="i" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg><span>Inbox</span></button>
      <button class="qr" data-action="soon" data-name="Scan QR" data-guide="tab.qr" aria-label="Scan QR"><span class="qr-btn"><svg class="i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M16 12h1"/><path d="M12 21v-1"/></svg></span></button>
      <button data-action="nav" data-to="transactions" data-tab="transactions" data-guide="tab.transactions"><svg class="i" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><span>Activity</span></button>
      <button data-action="nav" data-to="profile" data-tab="profile" data-guide="tab.profile"><svg class="i" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg><span>Profile</span></button>
    </nav>

    <!-- Overlay control: toggles blur on everything except Send / Load / Transfer / Bills (home screen only) -->
    <button id="focus-toggle" class="focus-toggle" type="button" data-action="toggle-focus" data-guide="overlay.focus-toggle" aria-pressed="false" hidden>
      <svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/></svg>
      <span id="focus-toggle-label">Focus: Off</span>
    </button>

    <div id="modal-root"></div>
    <div id="toast-root"></div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
